[workspace]
members = ["crates/domain", "crates/git-adapter", "crates/recipe-runner", "crates/operation-service", "crates/cli"]
exclude = ["archive/tauri-spike/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
schemars = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
fs2 = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"
